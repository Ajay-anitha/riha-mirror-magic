<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="specialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1D2B"/>
      <stop offset="50%" stop-color="#26101B"/>
      <stop offset="100%" stop-color="#16060E"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E5"/>
      <stop offset="50%" stop-color="#C5A46D"/>
      <stop offset="100%" stop-color="#8E6A34"/>
    </linearGradient>
  </defs>

  <!-- Full Rectangular Background -->
  <rect width="800" height="600" fill="url(#specialGrad)"/>

  <!-- Rectangular Luxury Borders (Strictly Zero Circles) -->
  <rect x="25" y="25" width="750" height="550" rx="4" stroke="url(#goldSheen)" stroke-width="1.5" opacity="0.85"/>
  <rect x="38" y="38" width="724" height="524" rx="2" stroke="#C5A46D" stroke-width="1" stroke-dasharray="6 4" opacity="0.45"/>

  <!-- Corner Ornamental Rectangular Accents -->
  <line x1="48" y1="48" x2="80" y2="48" stroke="#C5A46D" stroke-width="1.5"/>
  <line x1="48" y1="48" x2="48" y2="80" stroke="#C5A46D" stroke-width="1.5"/>
  <line x1="752" y1="48" x2="720" y2="48" stroke="#C5A46D" stroke-width="1.5"/>
  <line x1="752" y1="48" x2="752" y2="80" stroke="#C5A46D" stroke-width="1.5"/>
  <line x1="48" y1="552" x2="80" y2="552" stroke="#C5A46D" stroke-width="1.5"/>
  <line x1="48" y1="552" x2="48" y2="520" stroke="#C5A46D" stroke-width="1.5"/>
  <line x1="752" y1="552" x2="720" y2="552" stroke="#C5A46D" stroke-width="1.5"/>
  <line x1="752" y1="552" x2="752" y2="520" stroke="#C5A46D" stroke-width="1.5"/>

  <!-- Specialized Care Diamond & Cross Motif -->
  <polygon points="400,115 480,195 400,275 320,195" stroke="url(#goldSheen)" stroke-width="2" fill="none" opacity="0.9"/>
  <polygon points="400,135 460,195 400,255 340,195" stroke="#F3EDF9" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.65"/>
  <!-- Precise Care Cross Icon (Rectangles, No Circles) -->
  <rect x="395" y="170" width="10" height="50" fill="#C5A46D" rx="1"/>
  <rect x="375" y="190" width="50" height="10" fill="#C5A46D" rx="1"/>
  <line x1="260" y1="195" x2="305" y2="195" stroke="#C5A46D" stroke-width="1.5" opacity="0.7"/>
  <line x1="495" y1="195" x2="540" y2="195" stroke="#C5A46D" stroke-width="1.5" opacity="0.7"/>

  <!-- Typography -->
  <text x="400" y="360" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#C5A46D" text-anchor="middle" letter-spacing="4">CLINICAL PRECISION</text>
  <text x="400" y="415" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SPECIALITY CARE TREATMENT</text>
  <text x="400" y="460" font-family="'Montserrat', sans-serif" font-size="14" font-weight="300" fill="#F3EDF9" text-anchor="middle" opacity="0.9">Sterilized, gentle cosmetic care with minimal discomfort</text>
</svg>