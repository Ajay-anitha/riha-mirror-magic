<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="galGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F3061"/>
      <stop offset="50%" stop-color="#352044"/>
      <stop offset="100%" stop-color="#1E0F28"/>
    </linearGradient>
    <linearGradient id="galSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#765783"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#galGrad)"/>

  <!-- Subtle Luxury Mirror Frame Motif -->
  <rect x="50" y="50" width="700" height="900" rx="350" fill="none" stroke="url(#galSilver)" stroke-width="1.5" opacity="0.3"/>
  <rect x="70" y="70" width="660" height="860" rx="330" fill="none" stroke="#E9E9ED" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.2"/>

  <!-- Ornate Mirror Silhouette -->
  <g opacity="0.4" stroke="url(#galSilver)" stroke-width="2" fill="none">
    <ellipse cx="400" cy="450" rx="110" ry="140"/>
    <ellipse cx="400" cy="450" rx="90" ry="115" stroke-dasharray="3 3"/>
    <path d="M 400,310 L 400,280"/>
    <circle cx="400" cy="275" r="5" fill="#C0C0C0"/>
  </g>

  <text x="400" y="605" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#E9E9ED" text-anchor="middle" letter-spacing="3" opacity="0.6">
    GALLERY
  </text>
  <text x="400" y="635" font-family="'Montserrat', sans-serif" font-size="12" fill="#C0C0C0" text-anchor="middle" letter-spacing="2" opacity="0.4">
    IMAGE PLACEHOLDER
  </text>
</svg>