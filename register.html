<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Customer Account | Riha Mirror Magic</title>

  <!-- Fonts: Cormorant Garamond for Headings, Montserrat for Body & Inputs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Customer Account Stylesheet (Elegant Teal & Mist Theme, Zero Animations) -->
  <link rel="stylesheet" href="css/account.css">
</head>
<body class="account-theme">

  <div class="auth-page-wrapper">
    <div class="auth-card-box" style="max-width: 500px;">
      
      <!-- Brand Header -->
      <div class="auth-brand-header">
        <a href="index.html" style="text-decoration: none; display: inline-block;">
          <img src="assets/images/logo-placeholder.svg" alt="Riha Mirror Magic Logo" class="auth-brand-logo">
          <h1 class="auth-brand-title">Riha Mirror Magic</h1>
        </a>
        <p class="auth-page-subtitle">Create Customer Account</p>
      </div>

      <!-- Feedback / Error Message Box -->
      <div id="registerStatusMsg" class="status-msg-box" role="alert"></div>

      <!-- Registration Form -->
      <form id="customerRegisterForm" novalidate>
        
        <div class="form-group-item">
          <label for="regFullName" class="form-label-title">Full Name</label>
          <input type="text" 
                 id="regFullName" 
                 class="form-input-control" 
                 placeholder="e.g. Priya Sharma" 
                 required 
                 autocomplete="name">
        </div>

        <div class="form-group-item">
          <label for="regMobile" class="form-label-title">Mobile Number</label>
          <input type="tel" 
                 id="regMobile" 
                 class="form-input-control" 
                 placeholder="e.g. 9876543210 (10 digits)" 
                 required 
                 autocomplete="tel">
          <span style="font-size: 0.78rem; color: var(--teal-slate); margin-top: 3px;">For appointment SMS confirmations and updates</span>
        </div>

        <div class="form-group-item">
          <label for="regEmail" class="form-label-title">Email Address</label>
          <input type="email" 
                 id="regEmail" 
                 class="form-input-control" 
                 placeholder="e.g. priya@example.com" 
                 required 
                 autocomplete="email">
          <span style="font-size: 0.78rem; color: var(--teal-slate); margin-top: 3px;">For digital receipts and account security</span>
        </div>

        <div class="form-group-item">
          <label for="regPassword" class="form-label-title">Password (minimum 8 characters)</label>
          <div class="password-input-wrapper">
            <input type="password" 
                   id="regPassword" 
                   class="form-input-control" 
                   placeholder="Create a strong password" 
                   required 
                   minlength="8" 
                   autocomplete="new-password">
            <button type="button" class="toggle-password-btn" data-target="regPassword" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group-item">
          <label for="regConfirmPassword" class="form-label-title">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" 
                   id="regConfirmPassword" 
                   class="form-input-control" 
                   placeholder="Repeat your password" 
                   required 
                   minlength="8" 
                   autocomplete="new-password">
            <button type="button" class="toggle-password-btn" data-target="regConfirmPassword" aria-label="Toggle confirm password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div style="margin-top: 1.75rem;">
          <button type="submit" class="btn-teal-primary" id="btnRegisterSubmit" style="width: 100%; height: 46px;">
            Create Customer Account
          </button>
        </div>

      </form>

      <!-- Footer Navigation Links -->
      <div class="auth-footer-links">
        <p style="margin-bottom: 0.75rem;">
          Already have an account? <a id="loginLink" href="login.html">Log In</a>
        </p>
        <p style="margin: 0;">
          <a href="index.html" style="color: var(--teal-slate); text-decoration: none; font-size: 0.825rem;">
            ← Return to Riha Mirror Magic Home
          </a>
        </p>
      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check if already authenticated
      const existingCustomer = getCurrentCustomer();
      const urlParams = new URLSearchParams(window.location.search);
      const redirectTarget = urlParams.get('redirect');
      const serviceId = urlParams.get('serviceId');
      const productId = urlParams.get('productId');

      // Preserve query params for Login link
      const loginLink = document.getElementById('loginLink');
      if (loginLink && window.location.search) {
        loginLink.href = 'login.html' + window.location.search;
      }

      function handleRedirect() {
        if (redirectTarget === 'booking' && serviceId) {
          window.location.href = `service-details.html?id=${encodeURIComponent(serviceId)}&action=book`;
        } else if (redirectTarget === 'order' && productId) {
          window.location.href = `product-details.html?id=${encodeURIComponent(productId)}&action=order`;
        } else {
          window.location.href = 'account.html';
        }
      }

      if (existingCustomer) {
        handleRedirect();
        return;
      }

      // Password toggle buttons
      document.querySelectorAll('.toggle-password-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (!input) return;

          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            `;
          } else {
            input.type = 'password';
            btn.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            `;
          }
        });
      });

      // Registration form handler
      const regForm = document.getElementById('customerRegisterForm');
      const fullNameInput = document.getElementById('regFullName');
      const mobileInput = document.getElementById('regMobile');
      const emailInput = document.getElementById('regEmail');
      const passwordInput = document.getElementById('regPassword');
      const confirmPasswordInput = document.getElementById('regConfirmPassword');
      const statusMsg = document.getElementById('registerStatusMsg');

      regForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const fullName = fullNameInput.value.trim();
        const mobile = mobileInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!fullName) {
          showStatus('Please enter your full name.', 'error');
          fullNameInput.focus();
          return;
        }

        if (!mobile || mobile.replace(/\D/g, '').length < 10) {
          showStatus('Please enter a valid mobile number with at least 10 digits.', 'error');
          mobileInput.focus();
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          showStatus('Please enter a valid email address.', 'error');
          emailInput.focus();
          return;
        }

        if (!password || password.length < 8) {
          showStatus('Password must be at least 8 characters long.', 'error');
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showStatus('Passwords do not match. Please verify both password fields.', 'error');
          confirmPasswordInput.focus();
          return;
        }

        try {
          registerCustomer(fullName, mobile, email, password);
          showStatus('Account created successfully! Logging you in...', 'success');
          setTimeout(() => {
            handleRedirect();
          }, 400);
        } catch (err) {
          showStatus(err.message || 'Registration failed. Please check your information.', 'error');
        }
      });

      function showStatus(msg, type) {
        if (!statusMsg) return;
        statusMsg.textContent = msg;
        statusMsg.className = `status-msg-box ${type} visible`;
        statusMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
