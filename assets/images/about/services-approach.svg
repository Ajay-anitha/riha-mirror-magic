<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" fill="none">
  <defs>
    <linearGradient id="grad_SERVICES&APPROACH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C244D"/>
      <stop offset="50%" stop-color="#352044"/>
      <stop offset="100%" stop-color="#23142E"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#E9E9ED"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="900" fill="url(#grad_SERVICES&APPROACH)"/>
  <rect x="20" y="20" width="960" height="860" fill="none" stroke="url(#silverGrad)" stroke-width="1.5" opacity="0.3"/>
  <rect x="35" y="35" width="930" height="830" fill="none" stroke="#E9E9ED" stroke-width="0.75" stroke-dasharray="6 4" opacity="0.2"/>

  <!-- Brand Motif -->
  <g transform="translate(500, 420)" stroke="url(#silverGrad)" stroke-width="1.8" fill="none" opacity="0.4">
    <ellipse cx="0" cy="0" rx="45" ry="60"/>
    <path d="M -30,50 C -30,10 30,10 30,50"/>
    <circle cx="0" cy="-25" r="8" fill="#C0C0C0"/>
  </g>

  <text x="500" y="505" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-weight="600" fill="#E9E9ED" text-anchor="middle" letter-spacing="4" opacity="0.85">
    SERVICES & APPROACH
  </text>
  <text x="500" y="535" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#C0C0C0" text-anchor="middle" letter-spacing="3" opacity="0.6">
    EXQUISITE CARE
  </text>
</svg>