<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22132C"/>
      <stop offset="35%" stop-color="#352044"/>
      <stop offset="65%" stop-color="#4F3061"/>
      <stop offset="100%" stop-color="#1B0E24"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#765783" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#352044" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="silverHeroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#765783" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C0C0C0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#C0C0C0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#765783" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#heroGrad)"/>
  <rect width="1920" height="1080" fill="url(#heroGlow)"/>

  <!-- Subtle Geometric Luxury Lines / Mirror Prisms -->
  <g opacity="0.18">
    <circle cx="960" cy="540" r="420" stroke="#C0C0C0" stroke-width="1.5" fill="none"/>
    <circle cx="960" cy="540" r="320" stroke="#E9E9ED" stroke-width="0.8" stroke-dasharray="6 4" fill="none"/>
    <circle cx="960" cy="540" r="220" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
    <line x1="960" y1="60" x2="960" y2="1020" stroke="#C0C0C0" stroke-width="0.5"/>
    <line x1="300" y1="540" x2="1620" y2="540" stroke="#C0C0C0" stroke-width="0.5"/>
    <polygon points="960,180 1260,540 960,900 660,540" stroke="#C0C0C0" stroke-width="1" fill="none"/>
  </g>

  <!-- Luxury Silhouette Arch -->
  <path d="M 680,1080 L 680,480 A 280,280 0 0,1 1240,480 L 1240,1080 Z" fill="#352044" opacity="0.3" stroke="url(#silverHeroBorder)" stroke-width="2"/>

  <!-- Watermark text for placeholder -->
  <text x="960" y="520" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" fill="#E9E9ED" text-anchor="middle" letter-spacing="4" opacity="0.4">
    RIHA MIRROR MAGIC
  </text>
  <text x="960" y="560" font-family="'Montserrat', sans-serif" font-size="14" font-weight="300" fill="#C0C0C0" text-anchor="middle" letter-spacing="3" opacity="0.35">
    HERO PHOTOGRAPH PLACEHOLDER
  </text>
</svg>