<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="catSkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1E2C"/>
      <stop offset="60%" stop-color="#4E121B"/>
      <stop offset="100%" stop-color="#2D080E"/>
    </linearGradient>
    <linearGradient id="goldAcc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8D0"/>
      <stop offset="50%" stop-color="#D8A84E"/>
      <stop offset="100%" stop-color="#8E2635"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#catSkinGrad)"/>
  <rect x="25" y="25" width="550" height="400" rx="16" stroke="url(#goldAcc2)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Silhouette for Facial & Skin -->
  <g stroke="#D8A84E" stroke-width="2" fill="none" opacity="0.75">
    <ellipse cx="300" cy="180" rx="60" ry="75"/>
    <circle cx="300" cy="180" r="30" stroke-dasharray="4 3"/>
    <path d="M 220,290 C 220,230 260,220 300,220 C 340,220 380,230 380,290"/>
    <circle cx="300" cy="100" r="4" fill="#D8A84E"/>
  </g>
  
  <text x="300" y="340" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#FFFDFC" text-anchor="middle" letter-spacing="2">
    SKIN &amp; FACIAL CARE
  </text>
  <text x="300" y="375" font-family="'Montserrat', sans-serif" font-size="12" font-weight="500" fill="#D8A84E" text-anchor="middle" letter-spacing="3">
    CATEGORY
  </text>
</svg>