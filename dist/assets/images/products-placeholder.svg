<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C244D"/>
      <stop offset="50%" stop-color="#2D1A3B"/>
      <stop offset="100%" stop-color="#1A0D23"/>
    </linearGradient>
    <linearGradient id="prodSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#765783"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#prodGrad)"/>

  <!-- Subtle Luxury Bottle / Jar Outline Motif -->
  <rect x="50" y="50" width="700" height="900" rx="350" fill="none" stroke="url(#prodSilver)" stroke-width="1.5" opacity="0.3"/>
  <rect x="70" y="70" width="660" height="860" rx="330" fill="none" stroke="#E9E9ED" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.2"/>

  <g opacity="0.4" stroke="url(#prodSilver)" stroke-width="2" fill="none">
    <!-- Perfume/Cosmetic bottle -->
    <rect x="330" y="380" width="140" height="180" rx="16"/>
    <rect x="365" y="330" width="70" height="50" rx="6"/>
    <circle cx="400" cy="460" r="35"/>
    <line x1="330" y1="410" x2="470" y2="410"/>
  </g>

  <text x="400" y="590" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#E9E9ED" text-anchor="middle" letter-spacing="3" opacity="0.6">
    PRODUCTS
  </text>
  <text x="400" y="620" font-family="'Montserrat', sans-serif" font-size="12" fill="#C0C0C0" text-anchor="middle" letter-spacing="2" opacity="0.4">
    IMAGE PLACEHOLDER
  </text>
</svg>