<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="servGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2E60"/>
      <stop offset="50%" stop-color="#352044"/>
      <stop offset="100%" stop-color="#21122D"/>
    </linearGradient>
    <linearGradient id="servSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#765783"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#servGrad)"/>
  
  <!-- Subtle Ornamental Arch -->
  <rect x="50" y="50" width="700" height="900" rx="350" fill="none" stroke="url(#servSilver)" stroke-width="1.5" opacity="0.3"/>
  <rect x="70" y="70" width="660" height="860" rx="330" fill="none" stroke="#E9E9ED" stroke-width="0.75" stroke-dasharray="4 3" opacity="0.2"/>

  <!-- Stylized Hair & Beauty Artistry Silhouette / Scissors & Glow -->
  <g opacity="0.4" stroke="url(#servSilver)" stroke-width="2" fill="none">
    <circle cx="400" cy="460" r="140"/>
    <path d="M 330,520 Q 400,360 470,520"/>
    <path d="M 400,340 L 400,580"/>
    <path d="M 310,460 Q 400,430 490,460"/>
  </g>
  
  <text x="400" y="590" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#E9E9ED" text-anchor="middle" letter-spacing="3" opacity="0.6">
    SERVICES
  </text>
  <text x="400" y="620" font-family="'Montserrat', sans-serif" font-size="12" fill="#C0C0C0" text-anchor="middle" letter-spacing="2" opacity="0.4">
    IMAGE PLACEHOLDER
  </text>
</svg>